[package]
name = "anser-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/lib-x/anser-sdk-rust"
homepage = "https://ca-x.github.io/anser/"
description = "Official asynchronous Rust SDK for the Anser notification platform"
readme = "README.md"

[dependencies]
httpdate = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net"] }
