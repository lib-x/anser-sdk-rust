name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.94.0 fmt --check
      - run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.94.0 test --locked --all-targets
      - run: cargo +1.94.0 package --locked
